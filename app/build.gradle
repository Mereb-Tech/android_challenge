apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'
apply plugin: 'kotlin-android'

android {
    namespace 'com.example.androidchallenge'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.androidchallenge"
        minSdkVersion 33
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Emulator -> host machine. Change for a real device or remote server.
        buildConfigField "String", "GRPC_HOST", '"10.0.2.2"'
        buildConfigField "int", "GRPC_PORT", "50051"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Same protobuf/gRPC "lite" codegen setup as the main app.
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.1' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.81.0' }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins { java { option 'lite' } }
            task.plugins { grpc { option 'lite' } }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.3'

    // gRPC (lite) - same artifacts as the main app
    implementation 'io.grpc:grpc-okhttp:1.82.2'
    implementation 'io.grpc:grpc-protobuf-lite:1.82.2'
    implementation 'io.grpc:grpc-stub:1.82.2'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53' // @Generated for generated gRPC code

    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "io.grpc:grpc-inprocess:1.84.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "io.grpc:grpc-inprocess:1.84.0"
}
